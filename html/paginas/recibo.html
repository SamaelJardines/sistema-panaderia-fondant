<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recibo - Dulces Creaciones</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxygen+Mono&display=swap">
    <link rel="stylesheet" href="CSS/Est-Recibo.css">
</head>
<body class="pagina-recibo">
    
    <div class="recibo-decoracion" aria-hidden="true">
        <img src="../paginas/img/icons/baker.png" alt="">
        <img src="../paginas/img/icons/cupcake.png" alt="">
        <img src="../paginas/img/icons/cupcake.png" alt="">
        <img src="../paginas/img/icons/baker.png" alt="">
    </div>

    <main class="tarjeta-recibo">
        <img class="tarjeta-recibo__insignia" src="../paginas/img/icons/cupcake.png" alt="">

        <header>
            <img src="../paginas/img/logo-pagina.png" alt="Dulces Creaciones - Repostería Artesanal">
            <h1 class="tarjeta-recibo__titulo"><span>%usuario%</span>, ¡Pedido Confirmado!</h1>
        </header>

        <section>
            <img class="tarjeta-recibo__icono-exito" src="../paginas/img/icons/check.png" alt="Pedido aprobado">

            <p class="tarjeta-recibo__folio">Folio: <span>0001188446213</span></p>

            <article class="recibo-info">
                <h4>Documentación</h4>
                <p>
                    Hemos enviado una copia de la confirmación de la orden al correo vinculado a esta cuenta.
                    Si no recibes la copia, revisa la bandeja de correo no deseado.
                </p>
            </article>
        </section>

        <div class="recibo-iconos" aria-hidden="true">
            <img src="../paginas/img/icons/baguette.png" alt="">
            <img src="../paginas/img/icons/cupcake.png" alt="">
            <img src="../paginas/img/icons/baker.png" alt="">
            <img src="../paginas/img/icons/cupcake.png" alt="">
            <img src="../paginas/img/icons/baguette.png" alt="">
        </div>

        <nav class="recibo-acciones" aria-label="Acciones de la compra">
            <a class="btn-recibo" href="#">Descargar Ticket de Compra</a>
            <a class="btn-recibo" href="../index.html">Inicio</a>
        </nav>
    </main>
</body>
</html>
